<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Competency Assessment</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #FAFAF7;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --text-secondary: #555555;
  --text-muted: #999999;
  --accent: #D4740E;
  --accent-light: #F5A623;
  --accent-bg: #FEF9F3;
  --accent-border: #FCECD8;
  --border: #EEEBE6;
  --border-light: #F5F2ED;
  --green: #2D8A6E;
  --green-bg: #F0FAF6;
  --red: #C4553A;
  --red-bg: #FEF5F3;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 48px 24px 64px;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 40px;
}

.header .eyebrow {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 12px;
}

.header h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}

.header p {
  font-size: 15px;
  color: var(--text-secondary);
}

/* Progress */
.progress-wrap {
  margin-bottom: 32px;
}

.progress-bar {
  width: 100%;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}

.step-indicator {
  text-align: right;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}

/* Question Card */
.question-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 36px 32px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  display: none;
  animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.question-card.active { display: block; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.question-card .q-label {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 12px;
}

.question-card h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 28px;
  line-height: 1.6;
  color: var(--text);
}

/* Options */
.options { display: flex; flex-direction: column; gap: 10px; }

.option {
  padding: 14px 18px 14px 46px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  color: var(--text-secondary);
}

.option::before {
  content: attr(data-label);
  position: absolute;
  left: 14px;
  top: 14px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  transition: all 0.2s ease;
}

.option:hover {
  border-color: var(--accent-light);
  background: var(--accent-bg);
  color: var(--text);
}

.option:hover::before {
  border-color: var(--accent);
  color: var(--accent);
}

.option.selected {
  border-color: var(--accent);
  background: var(--accent-bg);
  color: var(--text);
}

.option.selected::before {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* Navigation */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border-light);
}

.btn {
  padding: 11px 24px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover { background: #B8620A; }
.btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

.btn-secondary {
  background: transparent;
  color: var(--text-muted);
  padding: 11px 16px;
}

.btn-secondary:hover { color: var(--text); }

.btn-submit {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  background: var(--accent);
  color: white;
  font-weight: 600;
  border-radius: var(--radius-sm);
}

.btn-submit:hover {
  background: #B8620A;
  box-shadow: 0 4px 12px rgba(212, 116, 14, 0.2);
}

/* Lead Gate */
.lead-gate {
  display: none;
  animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.lead-gate.active { display: block; }

.lead-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 40px 32px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  text-align: center;
}

.lead-card .lock-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 20px;
  background: var(--accent-bg);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lead-card .lock-icon svg {
  width: 22px;
  height: 22px;
  color: var(--accent);
}

.lead-card h2 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
}

.lead-card .subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 28px;
  line-height: 1.7;
}

.lead-card .teaser {
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin-bottom: 28px;
  text-align: left;
}

.lead-card .teaser .teaser-level {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}

.lead-card .teaser .teaser-hint {
  font-size: 13px;
  color: var(--text-secondary);
}

.lead-form { text-align: left; }

.lead-form .form-group {
  margin-bottom: 16px;
}

.lead-form label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.lead-form input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.2s;
  font-family: inherit;
  color: var(--text);
  background: var(--bg);
}

.lead-form input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
}

.lead-form input::placeholder { color: var(--text-muted); }

.lead-form .seminar-box {
  background: var(--green-bg);
  border: 1px solid #C8E6D9;
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 20px;
}

.lead-form .seminar-box h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--green);
  margin-bottom: 6px;
}

.lead-form .seminar-box p {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.lead-form .checkbox-wrap {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 12px;
}

.lead-form .checkbox-wrap input[type="checkbox"] {
  width: 16px;
  height: 16px;
  margin-top: 2px;
  accent-color: var(--green);
  flex-shrink: 0;
}

.lead-form .checkbox-wrap span {
  font-size: 13px;
  color: var(--text-secondary);
}

.btn-unlock {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  background: var(--accent);
  color: white;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}

.btn-unlock:hover {
  background: #B8620A;
  box-shadow: 0 4px 12px rgba(212, 116, 14, 0.2);
}

.btn-unlock:disabled {
  background: var(--border);
  color: var(--text-muted);
  cursor: not-allowed;
  box-shadow: none;
}

.consent-note {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-top: 16px;
  margin-bottom: 12px;
}

.skip-link {
  display: block;
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.skip-link:hover { color: var(--text-secondary); }

/* Results */
.results-page {
  display: none;
  animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.results-page.active { display: block; }

.result-hero {
  text-align: center;
  padding: 44px 32px 36px;
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.result-hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
}

.result-hero .score-badge {
  display: inline-block;
  padding: 5px 14px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 16px;
}

.result-hero h2 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}

.result-hero .level-name { color: var(--accent); }

.result-hero .desc {
  font-size: 15px;
  color: var(--text-secondary);
  max-width: 460px;
  margin: 12px auto 0;
  line-height: 1.8;
}

/* Level Track */
.level-track {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin: 28px 0 8px;
  position: relative;
}

.level-track::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 15%;
  right: 15%;
  height: 2px;
  background: var(--border);
  transform: translateY(-50%);
  z-index: 0;
}

.track-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
  position: relative;
  z-index: 1;
}

.track-node .node {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  transition: all 0.4s ease;
}

.track-node .node.reached {
  border-color: var(--accent-light);
  background: var(--accent-bg);
  color: var(--accent);
}

.track-node .node.current {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
  transform: scale(1.25);
  box-shadow: 0 2px 8px rgba(212, 116, 14, 0.3);
}

.track-node .node-label {
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
}

.track-node .node-label.current-label {
  color: var(--accent);
  font-weight: 600;
}

/* Report Sections */
.report-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 28px 28px;
  margin-bottom: 14px;
}

.report-card h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}

.report-card h3 .dot-icon {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.report-card.highlights h3 .dot-icon { background: var(--accent-light); }
.report-card.blockers h3 .dot-icon { background: var(--red); }
.report-card.nextsteps h3 .dot-icon { background: var(--green); }
.report-card.role-advice h3 .dot-icon { background: #6B7FD7; }

.report-card ul {
  list-style: none;
  padding: 0;
}

.report-card ul li {
  padding: 10px 0;
  padding-left: 16px;
  position: relative;
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-light);
}

.report-card ul li:last-child { border-bottom: none; padding-bottom: 0; }
.report-card ul li:first-child { padding-top: 0; }

.report-card ul li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 18px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-muted);
}

.report-card ul li:first-child::before { top: 8px; }

.report-card ul li strong {
  color: var(--text);
  font-weight: 600;
}

.report-card .role-badge {
  display: inline-block;
  padding: 3px 10px;
  background: #EEF0FF;
  border: 1px solid #D8DCF5;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 600;
  color: #6B7FD7;
  margin-bottom: 14px;
}

/* CTA bottom */
.cta-bottom {
  text-align: center;
  padding: 28px;
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-top: 20px;
}

.cta-bottom p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 14px;
}

.cta-bottom .btn-restart {
  padding: 10px 24px;
  font-size: 13px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}

.cta-bottom .btn-restart:hover {
  border-color: var(--text-secondary);
  color: var(--text);
}

/* Language Toggle */
.lang-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  display: flex;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px;
  box-shadow: var(--shadow-sm);
  z-index: 1000;
  font-size: 13px;
}

.lang-toggle button {
  padding: 5px 12px;
  border: none;
  border-radius: 16px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s;
  font-family: inherit;
}

.lang-toggle button.active {
  background: var(--accent);
  color: white;
}

/* Responsive */
@media (max-width: 480px) {
  .container { padding: 32px 16px 48px; }
  .question-card { padding: 28px 20px; }
  .lead-card { padding: 32px 20px; }
  .header h1 { font-size: 22px; }
  .result-hero { padding: 36px 20px 28px; }
  .result-hero h2 { font-size: 24px; }
  .report-card { padding: 22px 20px; }
  .track-node .node-label { font-size: 9px; }
}
</style>
</head>

<div class="lang-toggle">
  <button id="btn-en" class="active" onclick="switchLang('en')">EN</button>

</div>
<div class="container">

  <div class="header" id="quiz-header">

      <div class="progress-fill" id="progress-fill"></div>

  <!-- Questions rendered dynamically -->
  <div id="questions-container"></div>

  <!-- Lead Gate -->
  <div class="lead-gate" id="lead-gate">

  </div>

  <!-- Results -->
  <div class="results-page" id="results-page">
    <div class="result-hero" id="result-hero"></div>

    <div class="report-card highlights" id="report-highlights">
      <h3><span class="dot-icon"></span><span id="highlights-title"></span></h3>
      <ul id="highlights-list"></ul>

    <div class="report-card blockers" id="report-blockers">
      <h3><span class="dot-icon"></span><span id="blockers-title"></span></h3>
      <ul id="blockers-list"></ul>
    </div>

    <div class="report-card nextsteps" id="report-next">
      <h3><span class="dot-icon"></span><span id="nextsteps-title"></span></h3>
      <ul id="next-list"></ul>
    </div>

    <div class="report-card role-advice" id="report-role">
      <h3><span class="dot-icon"></span><span id="role-title"></span></h3>
      <div class="role-badge" id="role-badge"></div>
      <ul id="role-list"></ul>
    </div>

    <div class="cta-bottom">
      <p id="cta-text"></p>
      <button class="btn-restart" onclick="restart()" id="btn-restart"></button>
    </div>
  </div>
</div>

    { num: 5, labelKey: 'q5Label', titleKey: 'q5Title', optKey: 'q5Options', values: ['1','2','3','4','5'] },
    { num: 6, labelKey: 'q6Label', titleKey: 'q6Title', optKey: 'q6Options', values: ['1','2','3','4','5'] },
    { num: 7, labelKey: 'q7Label', titleKey: 'q7Title', optKey: 'q7Options', values: ['1','2','3','4','5'] },
    { num: 8, labelKey: 'q8Label', titleKey: 'q8Title', optKey: 'q8Options', values: ['1','2','3','4','5'], isLast: true }
  ];

  qConfigs.forEach(function(q) {
    var active = q.num === currentQ ? ' active' : '';
    var opts = t(q.optKey);
    var optsHTML = opts.map(function(text, idx) {
      var sel = answers[q.num] === q.values[idx] ? ' selected' : '';
      return '<div class="option' + sel + '" data-value="' + q.values[idx] + '" data-label="' + labels[idx] + '">' + text + '</div>';
    }).join('');

    var navHTML = '<div class="nav-buttons">';
    if (q.isFirst) {
      navHTML += '<div></div>';
      navHTML += '<button class="btn btn-primary" onclick="nextQuestion()"' + (!answers[q.num] ? ' disabled' : '') + '>' + t('next') + '</button>';
    } else if (q.isLast) {
      navHTML += '<button class="btn btn-secondary" onclick="prevQuestion()">' + t('prev') + '</button>';
      navHTML += '<button class="btn btn-submit" onclick="showLeadGate()"' + (!answers[q.num] ? ' disabled' : '') + '>' + t('submit') + '</button>';
    } else {
      navHTML += '<button class="btn btn-secondary" onclick="prevQuestion()">' + t('prev') + '</button>';
      navHTML += '<button class="btn btn-primary" onclick="nextQuestion()"' + (!answers[q.num] ? ' disabled' : '') + '>' + t('next') + '</button>';
    }
    navHTML += '</div>';

    var cardHTML = '<div class="question-card' + active + '" data-question="' + q.num + '">' +
      '<span class="q-label">' + t(q.labelKey) + '</span>' +
      '<h2>' + t(q.titleKey) + '</h2>' +
      '<div class="options">' + optsHTML + '</div>' +
      navHTML + '</div>';
    container.insertAdjacentHTML('beforeend', cardHTML);
  });

  container.querySelectorAll('.option').forEach(function(opt) {
    opt.addEventListener('click', function() {
      var card = this.closest('.question-card');
      card.querySelectorAll('.option').forEach(function(o) { o.classList.remove('selected'); });
      this.classList.add('selected');
      var qNum = parseInt(card.dataset.question);
      answers[qNum] = this.dataset.value;
      var btn = card.querySelector('.btn-primary, .btn-submit');
      if (btn) btn.disabled = false;
    });
  });
}

function applyLang() {
  document.getElementById('header-title').textContent = t('title');
  document.getElementById('header-subtitle').textContent = t('subtitle');
  document.getElementById('lead-title').textContent = t('leadTitle');
  document.getElementById('lead-subtitle').textContent = t('leadSubtitle');
  document.getElementById('teaser-hint').textContent = t('teaserHint');
  document.getElementById('label-name').textContent = t('nameLabel');
  document.getElementById('lead-name').placeholder = t('namePlaceholder');
  document.getElementById('label-email').textContent = t('emailLabel');
  document.getElementById('lead-email').placeholder = t('emailPlaceholder');
  document.getElementById('seminar-title').textContent = t('seminarTitle');
  document.getElementById('seminar-desc').textContent = t('seminarDesc');
  document.getElementById('seminar-check').textContent = t('seminarCheck');
  document.getElementById('consent-note').textContent = t('consent');
  document.getElementById('btn-unlock').textContent = t('unlock');
  document.getElementById('skip-link').textContent = t('skip');
  document.getElementById('highlights-title').textContent = t('highlightsTitle');
  document.getElementById('blockers-title').textContent = t('blockersTitle');
  document.getElementById('nextsteps-title').textContent = t('nextStepsTitle');
  document.getElementById('role-title').textContent = t('roleTitle');
  document.getElementById('cta-text').textContent = t('ctaText');
  document.getElementById('btn-restart').textContent = t('restart');
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-CN';
  document.title = currentLang === 'en' ? 'AI Competency Assessment' : '测测你跟AI的关系在哪一层';
  buildQuestions();
}

function switchLang(lang) {
  currentLang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
  applyLang();
  if (document.getElementById('results-page').classList.contains('active')) {
    showResults();
  }
}

function updateProgress() {
  var pct = (currentQ / totalQ) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('step-indicator').textContent = currentQ + ' / ' + totalQ;
}

function showQuestion(num) {
  document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
  var target = document.querySelector('[data-question="' + num + '"]');
  if (target) target.classList.add('active');
  currentQ = num;
  updateProgress();
}

function nextQuestion() {
  if (currentQ < totalQ) showQuestion(currentQ + 1);
}

function prevQuestion() {
  if (currentQ > 1) showQuestion(currentQ - 1);
}

function calculateLevel() {
  var scoreQ2to7 = 0;
  for (var i = 2; i <= 7; i++) {
    scoreQ2to7 += parseInt(answers[i] || 0);
  }
  var scoreQ8 = parseInt(answers[8] || 0);
  var finalScore = (scoreQ2to7 / 30) * 80 + (scoreQ8 / 5) * 20;

  var level;
  if (finalScore <= 25) level = 'L1';
  else if (finalScore <= 45) level = 'L2';
  else if (finalScore <= 65) level = 'L3';
  else if (finalScore <= 82) level = 'L4';
  else level = 'L5';

  return { level: level, score: Math.round(finalScore) };
}

function showLeadGate() {
  if (!answers[8]) return;

  var result = calculateLevel();
  computedLevel = result.level;
  computedScore = result.score;

  var data = levelData[currentLang][computedLevel];
  document.getElementById('teaser-level').textContent = computedLevel + ' | ' + data.name;

  document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('quiz-header').style.display = 'none';
  document.getElementById('lead-gate').classList.add('active');
}

function unlockResults() {
  var name = document.getElementById('lead-name').value.trim();
  var email = document.getElementById('lead-email').value.trim();

  if (!name || !email) {
    document.getElementById('lead-name').style.borderColor = name ? '' : 'var(--red)';
    document.getElementById('lead-email').style.borderColor = email ? '' : 'var(--red)';
    return;
  }

  var seminar = document.getElementById('lead-seminar').checked;
  sendResults(name, email, seminar);
  showResults();
}

function skipToResults() {
  sendResults('(skipped)', '(skipped)', false);
  showResults();
}

function showResults() {
  document.getElementById('lead-gate').classList.remove('active');

  var data = levelData[currentLang][computedLevel];
  var role = answers[1] || 'BP';
  var roleData = roleAdvice[currentLang][role];

  var levelNum = parseInt(computedLevel.replace('L', ''));
  var names = [levelData[currentLang].L1.name, levelData[currentLang].L2.name, levelData[currentLang].L3.name, levelData[currentLang].L4.name, levelData[currentLang].L5.name];
  var trackHTML = '';
  for (var i = 1; i <= 5; i++) {
    var cls = i < levelNum ? 'reached' : (i === levelNum ? 'current' : '');
    var labelCls = i === levelNum ? 'current-label' : '';
    trackHTML += '<div class="track-node"><div class="node ' + cls + '">L' + i + '</div><span class="node-label ' + labelCls + '">' + names[i-1] + '</span></div>';
  }

  document.getElementById('result-hero').innerHTML =
    '<div class="score-badge">' + t('scoreBadge') + ' ' + computedScore + ' / 100</div>' +
    '<h2>' + computedLevel + ' | <span class="level-name">' + data.name + '</span></h2>' +
    '<div class="level-track">' + trackHTML + '</div>' +
    '<p class="desc">' + data.desc + '</p>';

  document.getElementById('highlights-list').innerHTML = data.highlights.map(function(h) { return '<li>' + h + '</li>'; }).join('');
  document.getElementById('blockers-list').innerHTML = data.blockers.map(function(b) { return '<li>' + b + '</li>'; }).join('');
  document.getElementById('next-list').innerHTML = data.next.map(function(n) { return '<li>' + n + '</li>'; }).join('');

  document.getElementById('role-badge').textContent = roleData.label;
  document.getElementById('role-list').innerHTML = roleData.advice.map(function(a) { return '<li>' + a + '</li>'; }).join('');

  document.getElementById('results-page').classList.add('active');
  launchConfetti();
}

function sendResults(name, email, seminar) {
  var role = answers[1] || 'BP';
  var formData = new FormData();
  formData.append('Name', name);
  formData.append('Email', email);
  formData.append('Seminar', seminar ? 'Yes' : 'No');
  formData.append('Role', role);
  formData.append('Level', computedLevel);
  formData.append('Score', computedScore);
  formData.append('Q2_AI_Usage', answers[2] || '');
  formData.append('Q3_Work_Mode', answers[3] || '');
  formData.append('Q4_Prompt_Skills', answers[4] || '');
  formData.append('Q5_Context', answers[5] || '');
  formData.append('Q6_Agent', answers[6] || '');
  formData.append('Q7_Quality', answers[7] || '');
  formData.append('Q8_Scenario', answers[8] || '');
  formData.append('Language', currentLang);
  formData.append('_subject', 'AI Assessment | ' + name + ' | ' + role + ' | ' + computedLevel + ' (' + computedScore + ')');
  formData.append('_template', 'table');
  formData.append('_captcha', 'false');

  fetch('https://formsubmit.co/ajax/juanlijackie2020@gmail.com', {
    method: 'POST',
    body: formData
  }).catch(function() {});
}

function restart() {
  Object.keys(answers).forEach(function(k) { delete answers[k]; });
  currentQ = 1;
  document.getElementById('results-page').classList.remove('active');
  document.getElementById('progress-wrap').style.display = '';
  document.getElementById('quiz-header').style.display = '';
  applyLang();
  updateProgress();
}

function launchConfetti() {
  var canvas = document.createElement('canvas');
  canvas.id = 'confetti-canvas';
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
  document.body.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  var ribbons = [];
  var colors = ['#D4740E', '#F5A623', '#FFC767', '#FF6B6B', '#4ECDC4', '#6B7FD7', '#E8836B', '#2D8A6E'];

  for (var i = 0; i < 120; i++) {
    ribbons.push({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      w: Math.random() * 8 + 4,
      h: Math.random() * 16 + 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 4 + 2,
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 8,
      swing: Math.random() * 2,
      swingSpeed: Math.random() * 0.02 + 0.01,
      swingOffset: Math.random() * Math.PI * 2
    });
  }

  var frame = 0;
  var maxFrames = 180;

  function animate() {
    frame++;
    if (frame > maxFrames) {
      canvas.remove();
      return;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var opacity = frame > maxFrames - 30 ? (maxFrames - frame) / 30 : 1;
    ctx.globalAlpha = opacity;

    for (var i = 0; i < ribbons.length; i++) {
      var r = ribbons[i];
      r.x += r.vx + Math.sin(frame * r.swingSpeed + r.swingOffset) * r.swing;
      r.y += r.vy;
      r.rot += r.rotSpeed;

      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.rot * Math.PI / 180);
      ctx.fillStyle = r.color;
      ctx.fillRect(-r.w / 2, -r.h / 2, r.w, r.h);
      ctx.restore();
    }

    requestAnimationFrame(animate);
  }

  animate();
}

applyLang();
updateProgress();
