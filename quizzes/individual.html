<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assessment · Individual</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fbfbfd;
  --surface: #ffffff;
  --surface-2: #f5f5f7;
  --surface-raised: #ffffff;
  --surface-hover: #f5f5f7;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-muted: #86868b;
  --accent: #0071e3;
  --accent-dark: #0077ed;
  --accent-light: #2997ff;
  --accent-bg: rgba(0, 113, 227, 0.08);
  --accent-border: rgba(0, 113, 227, 0.22);
  --green: #34c759;
  --green-bg: rgba(52, 199, 89, 0.1);
  --green-border: rgba(52, 199, 89, 0.25);
  --red: #ff3b30;
  --red-bg: rgba(255, 59, 48, 0.08);
  --blue: #0071e3;
  --blue-bg: rgba(0, 113, 227, 0.08);
  --blue-border: rgba(0, 113, 227, 0.22);
  --border: #d2d2d7;
  --border-light: #e8e8ed;
  --radius: 22px;
  --radius-sm: 14px;
  --pill: 980px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 48px 24px 64px;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 40px;
}

/* Top bar */
.bar { display: flex; align-items: center; justify-content: space-between; max-width: 680px; margin: 0 auto; padding: 28px 24px 0; }
.wm { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); display: flex; align-items: center; gap: 9px; text-decoration: none; }
.wm .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--pill); padding: 2px; }
.seg button { border: none; background: transparent; color: var(--text-muted); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 14px; border-radius: var(--pill); cursor: pointer; transition: all .2s; }
.seg button.active { background: var(--text); color: #fff; }
.eyebrow{font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--accent);margin-bottom:14px;text-transform:uppercase;text-align:center;}

.header h1 {
  font-size: 30px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}

.header p {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* Progress */
.progress-wrap {
  margin-bottom: 32px;
}

.progress-bar {
  width: 100%;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}

.step-indicator {
  text-align: right;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.5px;
}

/* Question Card */
.question-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 36px 32px;
  border: 1px solid var(--border);
  display: none;
  animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.question-card.active { display: block; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.question-card .q-label {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 12px;
}

.question-card h2 {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 26px;
  line-height: 1.4;
  letter-spacing: -0.01em;
  color: var(--text);
}

/* Options */
.options { display: flex; flex-direction: column; gap: 8px; }

.option {
  padding: 13px 16px 13px 44px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  color: var(--text-secondary);
  background: var(--surface);
}

.option::before {
  content: attr(data-label);
  position: absolute;
  left: 12px;
  top: 13px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  transition: all 0.2s ease;
}

.option:hover {
  border-color: var(--accent-border);
  background: var(--accent-bg);
  color: var(--text);
}

.option:hover::before {
  border-color: var(--accent);
  color: var(--accent);
}

.option.selected {
  border-color: var(--accent);
  background: var(--accent-bg);
  color: var(--text);
}

.option.selected::before {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}

/* Navigation */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border-light);
}

.btn {
  padding: 11px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
  font-family: inherit;
}

.btn-primary {
  background: var(--accent);
  color: var(--bg);
}

.btn-primary:hover { background: var(--accent-light); }
.btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

.btn-secondary {
  background: transparent;
  color: var(--text-muted);
  padding: 11px 16px;
}

.btn-secondary:hover { color: var(--text); }

.btn-submit {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  background: var(--accent);
  color: var(--bg);
  font-weight: 600;
  border-radius: var(--radius-sm);
}

.btn-submit:hover {
  background: var(--accent-light);
}

/* Results */
.results-page {
  display: none;
  animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.results-page.active { display: block; }

.result-hero {
  text-align: center;
  padding: 44px 32px 36px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.result-hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--accent);
}

.result-hero .score-badge {
  display: inline-block;
  padding: 4px 12px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 16px;
  letter-spacing: 0.3px;
}

.result-hero h2 {
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.result-hero .level-name { color: var(--accent); }

.result-hero .desc {
  font-size: 14px;
  color: var(--text-secondary);
  max-width: 460px;
  margin: 12px auto 0;
  line-height: 1.8;
}

/* Level Track */
.level-track {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin: 28px 0 8px;
  position: relative;
}

.level-track::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 15%;
  right: 15%;
  height: 1px;
  background: var(--border);
  transform: translateY(-50%);
  z-index: 0;
}

.track-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
  position: relative;
  z-index: 1;
}

.track-node .node {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  transition: all 0.4s ease;
}

.track-node .node.reached {
  border-color: var(--accent-border);
  background: var(--accent-bg);
  color: var(--accent);
}

.track-node .node.current {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--bg);
  transform: scale(1.18);
}

.track-node .node-label {
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
}

.track-node .node-label.current-label {
  color: var(--accent);
  font-weight: 600;
}

/* Report Cards */
.report-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 26px 26px;
  margin-bottom: 12px;
}

.report-card h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  letter-spacing: -0.01em;
}

.report-card h3 .title-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.report-card.highlights h3 .title-icon { color: var(--accent-light); }
.report-card.blockers h3 .title-icon { color: var(--red); }
.report-card.nextsteps h3 .title-icon { color: var(--green); }
.report-card.role-advice h3 .title-icon { color: var(--blue); }

.report-card ul {
  list-style: none;
  padding: 0;
}

.report-card ul li {
  padding: 10px 0;
  padding-left: 14px;
  position: relative;
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-light);
}

.report-card ul li:last-child { border-bottom: none; padding-bottom: 0; }
.report-card ul li:first-child { padding-top: 0; }

.report-card ul li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 18px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-muted);
}

.report-card ul li:first-child::before { top: 8px; }

.report-card ul li strong {
  color: var(--text);
  font-weight: 600;
}

.report-card .role-badge {
  display: inline-block;
  padding: 3px 10px;
  background: var(--blue-bg);
  border: 1px solid var(--blue-border);
  border-radius: 14px;
  font-size: 11px;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 14px;
  letter-spacing: 0.3px;
}

/* CTA bottom */
.cta-bottom {
  text-align: center;
  padding: 28px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-top: 16px;
}

.cta-bottom p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 16px;
  line-height: 1.7;
}

.cta-bottom .btn-learn {
  display: inline-block;
  padding: 12px 28px;
  font-size: 14px;
  background: var(--accent);
  color: var(--bg);
  border-radius: var(--radius-sm);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.2s;
  font-family: inherit;
}

.cta-bottom .btn-learn:hover {
  background: var(--accent-dark);
}

.cta-bottom .btn-restart {
  display: block;
  margin: 14px auto 0;
  padding: 8px 20px;
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.cta-bottom .btn-restart:hover {
  border-color: var(--text-muted);
  color: var(--text-secondary);
}

.cta-bottom .btn-share {
  display: inline-block;
  margin-left: 10px;
  padding: 12px 28px;
  font-size: 14px;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
  font-family: inherit;
  vertical-align: top;
}

.cta-bottom .btn-share:hover {
  background: var(--accent);
  color: #fff;
}

/* Next-lens strip */
.next-lens {
  margin-top: 16px;
  padding: 26px 28px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.next-lens h3 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.3px;
  margin-bottom: 14px;
  color: var(--text);
}

.lens-links {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.lens-links a {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 14px 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  text-decoration: none;
  transition: all 0.2s;
}

.lens-links a:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.lens-links a strong {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.lens-links a span {
  font-size: 12px;
  line-height: 1.45;
  color: var(--text-secondary);
}

/* Result actions: PDF export + hub return */
.cta-bottom .btn-pdf {
  display: inline-block;
  margin-left: 0;
  padding: 12px 28px;
  font-size: 14px;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
  font-family: inherit;
  vertical-align: top;
}

.cta-bottom .btn-pdf:hover {
  background: var(--accent);
  color: #fff;
}

.cta-bottom .btn-hub {
  display: inline-block;
  margin-left: 10px;
  padding: 8px 20px;
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 500;
  transition: all 0.2s;
}

.cta-bottom .btn-hub:hover {
  border-color: var(--text-muted);
  color: var(--text-secondary);
}

/* One size for every result action */
.cta-bottom .btn-learn,
.cta-bottom .btn-share,
.cta-bottom .btn-pdf,
.cta-bottom .btn-restart,
.cta-bottom .btn-hub {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 46px;
  padding: 0 26px;
  font-size: 14px;
  font-weight: 600;
  box-sizing: border-box;
  vertical-align: top;
}

.cta-row + .cta-row {
  margin-top: 12px;
}

.cta-bottom .btn-restart {
  display: inline-flex;
  margin-left: 10px;
}

/* Print — export the result report as PDF */
.print-head { display: none; }
@media print {
  @page { margin: 14mm; }
  body { background: #fff; }
  .bar, .header, .progress-wrap, #questions-container, .next-lens, .cta-bottom, .ribbon-overlay { display: none !important; }
  .container { max-width: none; margin: 0; padding: 0; }
  .results-page { display: block !important; animation: none; }
  .print-head { display: block; font-size: 12px; color: #6e6e73; margin-bottom: 18px; }
  .result-hero, .report-card { break-inside: avoid; }
}

/* Language toggle now lives in the top .bar as .seg */

/* Responsive */
@media (max-width: 480px) {
  .container { padding: 32px 16px 48px; }
  .question-card { padding: 28px 20px; }
  .header h1 { font-size: 22px; }
  .lens-links { grid-template-columns: 1fr; }
  .cta-bottom .btn-share { margin-left: 0; margin-top: 10px; }
  .cta-bottom .btn-pdf { margin-left: 0; margin-top: 10px; }
  .cta-bottom .btn-restart { margin-left: 0; margin-top: 10px; }
  .cta-bottom .btn-hub { margin: 10px 0 0 0; }
  .result-hero { padding: 36px 20px 28px; }
  .result-hero h2 { font-size: 26px; }
  .report-card { padding: 20px 18px; }
  .track-node .node-label { font-size: 9px; }
}
/* Ribbon celebration */
.ribbon-overlay{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
.ribbon{position:absolute;top:0;will-change:transform;animation:ribbon-fall var(--fall) cubic-bezier(.3,.45,.55,1) var(--delay) both;}
.ribbon i{display:block;width:100%;height:100%;border-radius:2px;animation:ribbon-tumble var(--tumble) linear infinite;}
@keyframes ribbon-fall{
  0%{transform:translate3d(0,-72px,0) rotate(0deg);opacity:0;}
  6%{opacity:1;}
  85%{opacity:1;}
  100%{transform:translate3d(var(--sway),112vh,0) rotate(var(--spin));opacity:0;}
}
@keyframes ribbon-tumble{
  from{transform:rotate3d(1,.8,.3,0deg);}
  to{transform:rotate3d(1,.8,.3,360deg);}
}
</style>
</head>
<body>
<div class="bar">
  <a class="wm" href="../index.html"><span class="dot"></span><span id="wm"></span></a>
  <div class="seg">
    <button id="btn-en" class="active" onclick="switchLang('en')">EN</button>
    <button id="btn-zh" onclick="switchLang('zh')">中</button>
  </div>
</div>
<div class="container">
  <!-- Header -->
  <div class="header" id="quiz-header">
    <div class="eyebrow" id="header-eyebrow"></div>
    <h1 id="header-title"></h1>
    <p id="header-subtitle"></p>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="step-indicator" id="step-indicator">1 / 8</div>
  </div>

  <!-- Questions rendered dynamically -->
  <div id="questions-container"></div>

  <!-- Results -->
  <div class="results-page" id="results-page">
    <div class="print-head" id="print-head"></div>
    <div class="result-hero" id="result-hero"></div>

    <div class="report-card highlights" id="report-highlights">
      <h3><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.6l2.4 2.4 4.6-5.4"/></svg><span id="highlights-title"></span></h3>
      <ul id="highlights-list"></ul>
    </div>

    <div class="report-card blockers" id="report-blockers">
      <h3><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 5.1L3.3 17.3c-.8 1.4.2 3.2 1.8 3.2h13.8c1.6 0 2.6-1.8 1.8-3.2L13.7 5.1c-.8-1.4-2.6-1.4-3.4 0z"/><path d="M12 9.5v4.5"/><path d="M12 17.2h.01"/></svg><span id="blockers-title"></span></h3>
      <ul id="blockers-list"></ul>
    </div>

    <div class="report-card nextsteps" id="report-next">
      <h3><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span id="nextsteps-title"></span></h3>
      <ul id="next-list"></ul>
    </div>

    <div class="report-card role-advice" id="report-role">
      <h3><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="2.6"/><path d="M7.2 17.4c.9-2.5 2.7-3.9 4.8-3.9s3.9 1.4 4.8 3.9"/></svg><span id="role-title"></span></h3>
      <div class="role-badge" id="role-badge"></div>
      <ul id="role-list"></ul>
    </div>

    <div class="next-lens">
      <h3 id="next-lens-title"></h3>
      <div class="lens-links" id="lens-links"></div>
    </div>

    <div class="cta-bottom">
      <p id="cta-text"></p>
      <div class="cta-row">
        <a href="mailto:juanlijackie2020@gmail.com" class="btn-learn" id="btn-learn"></a>
        <button class="btn-share" onclick="shareResult()" id="btn-share"></button>
      </div>
      <div class="cta-row">
        <button class="btn-pdf" onclick="window.print()" id="btn-pdf"></button>
        <button class="btn-restart" onclick="restart()" id="btn-restart"></button>
        <a href="../index.html" class="btn-hub" id="btn-hub"></a>
      </div>
    </div>
  </div>
</div>

<script>
let currentLang = 'en';
const answers = {};
let currentQ = 1;
const totalQ = 8;
var advanceTimer = null;
var HUB_URL = '../index.html';
var lensLinks = [
  { href: 'team.html', nameKey: 'lensTeam', descKey: 'lensTeamD' },

        '<strong>用AI作为战略杠杆</strong> — 你的核心价值是"定方向、赋能团队、驱动结果"。AI帮你更快做出更有依据的决策：综合团队数据、识别模式、生成供你评估的策略选项',
        '<strong>重点场景</strong> — 决策简报与方案对比、利益相关方沟通、规划与情景建模、会议议程与会前材料、团队绩效模式分析',
        '<strong>升级方向</strong> — 成为团队的AI转型推动者。设定AI融入团队工作流的愿景，为实验分配时间，衡量采用进度。你的支持是团队是否真正使用AI的第一决定因素',
        '<strong>战略重点</strong> — 与其追求个人AI精通，不如为团队创造AI繁荣的条件：实验的心理安全感、清晰的数据治理准则、对AI驱动改进的认可'
      ]
    }
  }
};

const q1Values = ['business', 'tech', 'marketing', 'sales', 'specialist', 'management'];
const labels = ['A', 'B', 'C', 'D', 'E', 'F'];

function t(key) { return i18n[currentLang][key]; }

function buildQuestions() {
  var container = document.getElementById('questions-container');
  container.innerHTML = '';
  var qConfigs = [
    { num: 1, labelKey: 'q1Label', titleKey: 'q1Title', optKey: 'q1Options', values: q1Values, isFirst: true },
    { num: 2, labelKey: 'q2Label', titleKey: 'q2Title', optKey: 'q2Options', values: ['1','2','3','4','5'] },
    { num: 3, labelKey: 'q3Label', titleKey: 'q3Title', optKey: 'q3Options', values: ['1','2','3','4','5'] },
    { num: 4, labelKey: 'q4Label', titleKey: 'q4Title', optKey: 'q4Options', values: ['1','2','3','4','5'] },
    { num: 5, labelKey: 'q5Label', titleKey: 'q5Title', optKey: 'q5Options', values: ['1','2','3','4','5'] },
    { num: 6, labelKey: 'q6Label', titleKey: 'q6Title', optKey: 'q6Options', values: ['1','2','3','4','5'] },
    { num: 7, labelKey: 'q7Label', titleKey: 'q7Title', optKey: 'q7Options', values: ['1','2','3','4','5'] },
    { num: 8, labelKey: 'q8Label', titleKey: 'q8Title', optKey: 'q8Options', values: ['1','2','3','4','5'], isLast: true }
  ];

  qConfigs.forEach(function(q) {
    var active = q.num === currentQ ? ' active' : '';
    var opts = t(q.optKey);
    var optsHTML = opts.map(function(text, idx) {
      var sel = answers[q.num] === q.values[idx] ? ' selected' : '';
      return '<div class="option' + sel + '" data-value="' + q.values[idx] + '" data-label="' + labels[idx] + '">' + text + '</div>';
    }).join('');

    var navHTML = '<div class="nav-buttons">';
    if (q.isFirst) {
      navHTML += '<div></div>';
      navHTML += '<button class="btn btn-primary" onclick="nextQuestion()"' + (!answers[q.num] ? ' disabled' : '') + '>' + t('next') + '</button>';
    } else if (q.isLast) {
      navHTML += '<button class="btn btn-secondary" onclick="prevQuestion()">' + t('prev') + '</button>';
      navHTML += '<button class="btn btn-submit" onclick="submitQuiz()"' + (!answers[q.num] ? ' disabled' : '') + '>' + t('submit') + '</button>';
    } else {
      navHTML += '<button class="btn btn-secondary" onclick="prevQuestion()">' + t('prev') + '</button>';
      navHTML += '<button class="btn btn-primary" onclick="nextQuestion()"' + (!answers[q.num] ? ' disabled' : '') + '>' + t('next') + '</button>';
    }
    navHTML += '</div>';

    var cardHTML = '<div class="question-card' + active + '" data-question="' + q.num + '">' +
      '<span class="q-label">' + t(q.labelKey) + '</span>' +
      '<h2>' + t(q.titleKey) + '</h2>' +
      '<div class="options">' + optsHTML + '</div>' +
      navHTML + '</div>';
    container.insertAdjacentHTML('beforeend', cardHTML);
  });

  container.querySelectorAll('.option').forEach(function(opt) {
    opt.addEventListener('click', function() {
      var card = this.closest('.question-card');
      card.querySelectorAll('.option').forEach(function(o) { o.classList.remove('selected'); });
      this.classList.add('selected');
      var qNum = parseInt(card.dataset.question);
      answers[qNum] = this.dataset.value;
      var btn = card.querySelector('.btn-primary, .btn-submit');
      if (btn) btn.disabled = false;
      if (advanceTimer) clearTimeout(advanceTimer);
      if (qNum < totalQ) {
        advanceTimer = setTimeout(function() {
          if (currentQ === qNum) nextQuestion();
        }, 420);
      }
    });
  });
}

function applyLang() {
  document.getElementById('wm').textContent = t('wm');
  document.getElementById('header-eyebrow').textContent = t('eyebrow');
  document.getElementById('header-title').textContent = t('title');
  document.getElementById('header-subtitle').textContent = t('subtitle');
  document.getElementById('highlights-title').textContent = t('highlightsTitle');
  document.getElementById('blockers-title').textContent = t('blockersTitle');
  document.getElementById('nextsteps-title').textContent = t('nextStepsTitle');
  document.getElementById('role-title').textContent = t('roleTitle');
  document.getElementById('cta-text').textContent = t('ctaText');
  document.getElementById('btn-learn').textContent = t('learnBtn');
  document.getElementById('btn-share').textContent = t('shareBtn');
  document.getElementById('btn-pdf').textContent = t('pdfBtn');
  document.getElementById('btn-restart').textContent = t('restart');
  document.getElementById('btn-hub').textContent = t('hubBtn');
  document.getElementById('print-head').textContent = t('wm') + ' · ' + t('title') + ' · ' + new Date().toLocaleDateString(currentLang === 'en' ? 'en-GB' : 'zh-CN');
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-CN';
  document.title = currentLang === 'en' ? 'AI Assessment · Individual' : 'AI 测评 · 个人';
  buildQuestions();
  buildLensLinks();
}

function switchLang(lang) {
  currentLang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
  applyLang();
  if (document.getElementById('results-page').classList.contains('active')) {
    showResults();
  }
}

function updateProgress() {
  var pct = (currentQ / totalQ) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('step-indicator').textContent = currentQ + ' / ' + totalQ;
}

function showQuestion(num) {
  document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
  var target = document.querySelector('[data-question="' + num + '"]');
  if (target) target.classList.add('active');
  currentQ = num;
  updateProgress();
}

function nextQuestion() {
  if (currentQ < totalQ) showQuestion(currentQ + 1);
}

function prevQuestion() {
  if (currentQ > 1) showQuestion(currentQ - 1);
}

function calculateLevel() {
  var scoreQ2to7 = 0;
  for (var i = 2; i <= 7; i++) {
    scoreQ2to7 += parseInt(answers[i] || 0);
  }
  var scoreQ8 = parseInt(answers[8] || 0);
  var finalScore = (scoreQ2to7 / 30) * 80 + (scoreQ8 / 5) * 20;

  var level;
  if (finalScore <= 25) level = 'L1';
  else if (finalScore <= 45) level = 'L2';
  else if (finalScore <= 65) level = 'L3';
  else if (finalScore <= 82) level = 'L4';
  else level = 'L5';

  return { level: level, score: Math.round(finalScore) };
}

function submitQuiz() {
  if (!answers[8]) return;

  var result = calculateLevel();
  computedLevel = result.level;
  computedScore = result.score;

  document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('header-title').style.display = 'none';
  document.getElementById('header-subtitle').style.display = 'none';
  showResults();
  launchRibbons();
}

function showResults() {
  var data = levelData[currentLang][computedLevel];
  var role = answers[1] || 'business';
  var roleData = roleAdvice[currentLang][role];

  var levelNum = parseInt(computedLevel.replace('L', ''));
  var names = [levelData[currentLang].L1.name, levelData[currentLang].L2.name, levelData[currentLang].L3.name, levelData[currentLang].L4.name, levelData[currentLang].L5.name];
  var trackHTML = '';
  for (var i = 1; i <= 5; i++) {
    var cls = i < levelNum ? 'reached' : (i === levelNum ? 'current' : '');
    var labelCls = i === levelNum ? 'current-label' : '';
    trackHTML += '<div class="track-node"><div class="node ' + cls + '">L' + i + '</div><span class="node-label ' + labelCls + '">' + names[i-1] + '</span></div>';
  }

  document.getElementById('result-hero').innerHTML =
    '<div class="score-badge">' + t('scoreBadge') + ' ' + computedScore + ' / 100</div>' +
    '<h2>' + computedLevel + ' | <span class="level-name">' + data.name + '</span></h2>' +
    '<div class="level-track">' + trackHTML + '</div>' +
    '<p class="desc">' + data.desc + '</p>';

  document.getElementById('highlights-list').innerHTML = data.highlights.map(function(h) { return '<li>' + h + '</li>'; }).join('');
  document.getElementById('blockers-list').innerHTML = data.blockers.map(function(b) { return '<li>' + b + '</li>'; }).join('');
  document.getElementById('next-list').innerHTML = data.next.map(function(n) { return '<li>' + n + '</li>'; }).join('');

  document.getElementById('role-badge').textContent = roleData.label;
  document.getElementById('role-list').innerHTML = roleData.advice.map(function(a) { return '<li>' + a + '</li>'; }).join('');

  document.getElementById('results-page').classList.add('active');
  animateScore();
}

function buildLensLinks() {
  var el = document.getElementById('lens-links');
  el.innerHTML = lensLinks.map(function(l) {
    return '<a href="' + l.href + '"><strong>' + t(l.nameKey) + '</strong><span>' + t(l.descKey) + '</span></a>';
  }).join('');
  document.getElementById('next-lens-title').textContent = t('nextLensTitle');
}

function shareResult() {
  var data = levelData[currentLang][computedLevel];
  var text = currentLang === 'en'
    ? 'I just found out where I stand with AI: ' + computedLevel + ' · ' + data.name + '. 8 questions, 2 minutes, scored in your browser — find your level:'
    : '我刚测了我的 AI 水平：' + computedLevel + ' · ' + data.name + '。8 道题、2 分钟、浏览器内评分——来测测你的：';
  text += ' ' + new URL(HUB_URL, location.href).href;
  copyToClipboard(text);
  var btn = document.getElementById('btn-share');
  btn.textContent = t('copied');
  setTimeout(function() { btn.textContent = t('shareBtn'); }, 1800);
}

function copyToClipboard(text) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
}

function restart() {
  Object.keys(answers).forEach(function(k) { delete answers[k]; });
  currentQ = 1;
  document.getElementById('results-page').classList.remove('active');
  document.getElementById('progress-wrap').style.display = '';
  document.getElementById('header-title').style.display = '';
  document.getElementById('header-subtitle').style.display = '';
  applyLang();
  updateProgress();
}

function animateScore() {
  var badge = document.querySelector('#result-hero .score-badge');
  if (!badge) return;
  var label = t('scoreBadge') + ' ';
  badge.textContent = label + '0 / 100';
  var start = null, dur = 900;
  function step(ts) {
    if (!start) start = ts;
    var p = Math.min((ts - start) / dur, 1);
    var eased = 1 - Math.pow(1 - p, 3);
    badge.textContent = label + Math.round(computedScore * eased) + ' / 100';
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

applyLang();
updateProgress();
function launchRibbons() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var old = document.querySelector('.ribbon-overlay');
  if (old) old.remove();
  var colors = ['#0071e3', '#2997ff', '#34c759', '#ffcc00', '#ff9f0a', '#ff375f', '#af52de'];
  var overlay = document.createElement('div');
  overlay.className = 'ribbon-overlay';
  for (var i = 0; i < 34; i++) {
    var r = document.createElement('div');
    r.className = 'ribbon';
    r.style.left = (Math.random() * 100) + '%';
    var isStream = Math.random() < 0.22;
    r.style.width = (isStream ? 5 + Math.random() * 2 : 6 + Math.random() * 4) + 'px';
    r.style.height = (isStream ? 52 + Math.random() * 34 : 16 + Math.random() * 22) + 'px';
    r.style.setProperty('--fall', (2.3 + Math.random() * 1.3) + 's');
    r.style.setProperty('--delay', (Math.random() * 0.9) + 's');
    r.style.setProperty('--sway', (Math.random() * 180 - 90) + 'px');
    r.style.setProperty('--spin', (Math.random() < 0.5 ? '-' : '') + (300 + Math.floor(Math.random() * 500)) + 'deg');
    r.style.setProperty('--tumble', (0.6 + Math.random() * 0.7) + 's');
    var s = document.createElement('i');
    s.style.background = colors[i % colors.length];
    r.appendChild(s);
    overlay.appendChild(r);
  }
  document.body.appendChild(overlay);
  setTimeout(function() { overlay.remove(); }, 4800);
}
</script>
