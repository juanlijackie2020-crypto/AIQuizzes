<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assessment · Find your level</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root{
  --bg:#fbfbfd;
  --surface:#ffffff;
  --surface-2:#f5f5f7;
  --text:#1d1d1f;
  --text-2:#6e6e73;
  --text-3:#86868b;
  --accent:#0071e3;
  --accent-2:#2997ff;
  --border:#d2d2d7;
  --radius:22px;
  --pill:980px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}

html,body{background:var(--bg);color:var(--text);font-family:var(--font);}
body{min-height:100vh;line-height:1.47;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}

.bar{display:flex;align-items:center;justify-content:space-between;max-width:1040px;margin:0 auto;padding:22px 28px;}
.wordmark{font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--text);display:flex;align-items:center;gap:9px;}
.wordmark .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--pill);padding:2px;}
.seg button{border:none;background:transparent;color:var(--text-3);font:inherit;font-size:13px;font-weight:600;padding:5px 14px;border-radius:var(--pill);cursor:pointer;transition:all .2s;}
.seg button.on{background:var(--text);color:#fff;}

.hero{max-width:1040px;margin:0 auto;padding:64px 28px 48px;}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--accent);margin-bottom:16px;text-transform:uppercase;}
h1.head{font-size:clamp(40px,7vw,72px);line-height:1.04;letter-spacing:-0.025em;font-weight:600;margin-bottom:20px;}
.sub{font-size:clamp(18px,2.3vw,23px);line-height:1.42;color:var(--text-2);font-weight:400;max-width:640px;}
.metarow{margin-top:28px;font-size:14px;color:var(--text-3);font-weight:500;}

.grid{max-width:1040px;margin:0 auto;padding:8px 28px 28px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}

.tile{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px 28px 26px;text-decoration:none;color:inherit;transition:transform .28s cubic-bezier(.25,.1,.25,1),box-shadow .28s,background .28s,border-color .28s;min-height:258px;opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.25,.1,.25,1) forwards;}
.tile:nth-child(2){animation-delay:.07s;}
.tile:nth-child(3){animation-delay:.14s;}
.tile:nth-child(4){animation-delay:.21s;}
@keyframes rise{to{opacity:1;transform:translateY(0);}}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.08);border-color:#c8c8d0;}
.tile .ic{width:32px;height:32px;color:var(--accent);margin-bottom:22px;}
.tile .eb{font-size:13px;font-weight:600;letter-spacing:0.01em;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.tile .new{font-size:10px;font-weight:700;letter-spacing:0.06em;background:var(--accent);color:#fff;padding:2px 7px 1px;border-radius:var(--pill);text-transform:uppercase;}
.tile h2{font-size:27px;font-weight:600;letter-spacing:-0.012em;color:var(--text);margin-bottom:10px;}
.tile .desc{font-size:15px;line-height:1.5;color:var(--text-2);flex:1;}
.tile .met{font-size:12px;color:var(--text-3);font-weight:500;margin-top:20px;}
.tile .pill{display:inline-flex;align-items:center;gap:5px;margin-top:16px;font-size:15px;font-weight:500;color:var(--accent);align-self:flex-start;}
.tile .pill svg{width:15px;height:15px;transition:transform .2s;}
.tile:hover .pill svg{transform:translateX(2px);}

.foot{max-width:1040px;margin:0 auto;padding:40px 28px 60px;font-size:12px;color:var(--text-3);text-align:center;letter-spacing:0.01em;}

@media(max-width:760px){
  .grid{grid-template-columns:1fr;}
  .hero{padding:48px 22px 36px;}
  .bar{padding:16px 22px;}
  .tile{min-height:auto;padding:26px 22px 22px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}.tile{opacity:1;transform:none;}}
</style>
</head>
<body>

<div class="bar">
  <div class="wordmark"><span class="dot"></span><span id="wm"></span></div>
  <div class="seg">
    <button id="btn-en" class="on" onclick="switchLang('en')">EN</button>
    <button id="btn-zh" onclick="switchLang('zh')">中</button>
  </div>
</div>

<section class="hero">
  <div class="eyebrow" id="ey"></div>
  <h1 class="head" id="head"></h1>
  <p class="sub" id="sub"></p>
  <p class="metarow" id="metarow"></p>
</section>

<section class="grid">

  <a class="tile" href="ai-level-quiz-internal.html">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
    </svg>
    <div class="eb" id="ind-eb"></div>
    <h2 id="ind-t"></h2>
    <p class="desc" id="ind-d"></p>
    <p class="met" id="ind-m"></p>
    <span class="pill"><span id="ind-cta"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>

  <a class="tile" href="ai-level-quiz-team.html">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="7" r="3"/>
      <path d="M6 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      <circle cx="5.5" cy="9" r="2.2"/>
      <circle cx="18.5" cy="9" r="2.2"/>
      <path d="M2 19c0-2.5 1.5-4.5 3.5-4.5M22 19c0-2.5-1.5-4.5-3.5-4.5"/>
    </svg>
    <div class="eb"><span id="team-eb"></span><span class="new" id="team-new"></span></div>
    <h2 id="team-t"></h2>
    <p class="desc" id="team-d"></p>
    <p class="met" id="team-m"></p>
    <span class="pill"><span id="team-cta"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>

  <a class="tile" href="ai-level-quiz-leadership.html">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="4.5" r="2.5"/>
      <path d="M12 7.5V13M7 13h10M8.5 13v5M15.5 13v5"/>
    </svg>
    <div class="eb" id="lead-eb"></div>
    <h2 id="lead-t"></h2>
    <p class="desc" id="lead-d"></p>
    <p class="met" id="lead-m"></p>
    <span class="pill"><span id="lead-cta"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>

  <a class="tile" href="ai-level-quiz-organization.html">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M9.5 10h.01M14.5 10h.01M9.5 13h.01M14.5 13h.01"/>
    </svg>
    <div class="eb" id="org-eb"></div>
    <h2 id="org-t"></h2>
    <p class="desc" id="org-d"></p>
    <p class="met" id="org-m"></p>
    <span class="pill"><span id="org-cta"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>

</section>

<p class="foot" id="foot"></p>

<script>
let currentLang = 'en';

const i18n = {
  en: {
    wm: 'AI Assessment',
    ey: 'Four lenses',
    head: 'Find your AI level.',
    sub: 'Pick the one that fits — you, your team, your leadership, or your whole organization. Each plots you on a clear scale in a few minutes.',
    metarow: '8–11 questions · 2–3 minutes · scored in your browser',
    indEb: 'For you',
    indT: 'Individual',
    indD: 'Assess your own AI collaboration capability — how you use AI in daily work, your prompting and agent skills, and where your relationship with AI sits today.',
    indM: '8 questions · ~2 minutes',
    indCta: 'Start',
    teamEb: 'For your team',
    teamNew: 'New',
    teamT: 'Team',
    teamD: 'Measure your team’s collective AI maturity — from fragmented personal use to a governed, shared AI system. Lands on one of five rungs, L1 to L5.',
    teamM: '8 questions · ~2 minutes',
    teamCta: 'Start',
    leadEb: 'For leaders',
    leadT: 'Leadership',
    leadD: 'How ready you are to lead an AI-native team — setting vision, sponsoring experimentation, and creating the conditions for others to thrive with AI.',
    leadM: 'Leadership readiness self-check',
    leadCta: 'Start',
    orgEb: 'For the org',
    orgT: 'Organization',
    orgD: 'Diagnose how AI-native your organization is — plot it on two axes (AI Nativeness × Organizational Readiness) and land in one of four quadrants: Leader, Explorer, Commando, or Onlooker.',
    orgM: '11 questions · ~3 minutes',
    orgCta: 'Start',
    foot: 'Scored in your browser · no data leaves your device'
  },
  zh: {
    wm: 'AI 测评',
    ey: '四个视角',
    head: '测测你的 AI 水平。',
    sub: '选最适合你的那一个——你个人、你的团队、你的领导力，或整个组织。几分钟内，每一个都会把你定位到一条清晰的标尺上。',
    metarow: '8–11 道题 · 2–3 分钟 · 浏览器内评分',
    indEb: '面向个人',
    indT: '个人',
    indD: '评估你自己的 AI 协作能力——日常如何使用 AI、提示词与 Agent 技能，以及你与 AI 的关系目前处于哪一层。',
    indM: '8 道题 · 约 2 分钟',
    indCta: '开始',
    teamEb: '面向团队',
    teamNew: '新',
    teamT: '团队',
    teamD: '衡量你团队的集体 AI 成熟度——从零散的个人使用，到治理化、共享的 AI 系统。落在 L1 到 L5 五个层级之一。',
    teamM: '8 道题 · 约 2 分钟',
    teamCta: '开始',
    leadEb: '面向领导者',
    leadT: '领导力',
    leadD: '你作为 AI 原生团队领导者的准备度——设定方向、赞助实验，并为团队创造用好 AI 的条件。',
    leadM: '领导者准备度自评',
    leadCta: '开始',
    orgEb: '面向组织',
    orgT: '组织',
    orgD: '诊断你的组织有多 AI 原生——在原生度 × 组织就绪度两轴上定位，落入引领者、探索者、特战队、观望者四个象限之一。',
    orgM: '11 道题 · 约 3 分钟',
    orgCta: '开始',
    foot: '浏览器内评分 · 数据不离开你的设备'
  }
};

function t(key){ return i18n[currentLang][key]; }

function applyLang(){
  document.getElementById('wm').textContent = t('wm');
  document.getElementById('ey').textContent = t('ey');
  document.getElementById('head').textContent = t('head');
  document.getElementById('sub').textContent = t('sub');
  document.getElementById('metarow').textContent = t('metarow');
  document.getElementById('ind-eb').textContent = t('indEb');
  document.getElementById('ind-t').textContent = t('indT');
  document.getElementById('ind-d').textContent = t('indD');
  document.getElementById('ind-m').textContent = t('indM');
  document.getElementById('ind-cta').textContent = t('indCta');
  document.getElementById('team-eb').textContent = t('teamEb');
  document.getElementById('team-new').textContent = t('teamNew');
  document.getElementById('team-t').textContent = t('teamT');
  document.getElementById('team-d').textContent = t('teamD');
  document.getElementById('team-m').textContent = t('teamM');
  document.getElementById('team-cta').textContent = t('teamCta');
  document.getElementById('lead-eb').textContent = t('leadEb');
  document.getElementById('lead-t').textContent = t('leadT');
  document.getElementById('lead-d').textContent = t('leadD');
  document.getElementById('lead-m').textContent = t('leadM');
  document.getElementById('lead-cta').textContent = t('leadCta');
  document.getElementById('org-eb').textContent = t('orgEb');
  document.getElementById('org-t').textContent = t('orgT');
  document.getElementById('org-d').textContent = t('orgD');
  document.getElementById('org-m').textContent = t('orgM');
  document.getElementById('org-cta').textContent = t('orgCta');
  document.getElementById('foot').textContent = t('foot');
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-CN';
  document.title = currentLang === 'en' ? 'AI Assessment · Find your level' : 'AI 测评 · 找到你的水平';
}

function switchLang(lang){
  currentLang = lang;
  document.getElementById('btn-en').classList.toggle('on', lang === 'en');
  document.getElementById('btn-zh').classList.toggle('on', lang === 'zh');
  applyLang();
}

applyLang();
</script>
</body>
</html>
