<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assessment · Organization</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fbfbfd;
  --surface: #ffffff;
  --surface-2: #f5f5f7;
  --surface-raised: #ffffff;
  --surface-hover: #f5f5f7;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-muted: #86868b;
  --accent: #0071e3;
  --accent-dark: #0077ed;
  --accent-light: #2997ff;
  --accent-bg: rgba(0,113,227,0.08);
  --accent-border: rgba(0,113,227,0.22);
  --border: #d2d2d7;
  --border-light: #e8e8ed;
  --radius: 22px;
  --radius-sm: 14px;
  --pill: 980px;
  --grd: var(--accent);
  --q-leader: #34c759;
  --q-explorer: #0071e3;
  --q-commando: #FF9500;
  --q-onlooker: #86868b;
  --red: #ff3b30;
  --green: #34c759;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.mono { font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace; font-variant-numeric: tabular-nums; }

.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 48px 24px 64px;
}

/* Language toggle now lives in the top .bar as .seg */

/* Header */
.header {
  text-align: center;
  margin-bottom: 36px;
}
.bar{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:0 auto;padding:28px 24px 0;}
.wm{font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--text);display:flex;align-items:center;gap:9px;text-decoration:none;}
.wm .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--pill);padding:2px;}
.seg button{border:none;background:transparent;color:var(--text-muted);font:inherit;font-size:13px;font-weight:600;padding:5px 14px;border-radius:var(--pill);cursor:pointer;transition:all .2s;}
.seg button.active{background:var(--text);color:#fff;}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--accent);margin-bottom:14px;text-transform:uppercase;text-align:center;}
.header h1 {
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text);
  margin-bottom: 10px;
}
.header p {
  font-size: 15px;
  color: var(--text-muted);
  max-width: 520px;
  margin: 0 auto;
  line-height: 1.7;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 28px;
  margin-bottom: 24px;
}
.card-head {
  margin-bottom: 24px;
}
.card-head .ch-eyebrow {
  font-family: var(--font);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}
.card-head h2 {
  font-family: var(--font);
  font-size: 22px;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 8px;
  letter-spacing: -0.2px;
}
.card-head p {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
}

/* Model preview */
.model-layout {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 8px;
  align-items: stretch;
}
.axis-y {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-family: var(--font);
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}
.axis-y .ay-name { color: var(--text-secondary); }
.model-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 10px;
}
.mcell {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-radius: var(--radius-sm);
  padding: 16px 14px;
  transition: all 0.25s ease;
}
.mcell .mtop {
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.mcell .me { font-size: 16px; }
.mcell .mn {
  font-family: var(--font);
  font-size: 16px;
  font-weight: 500;
}
.mcell .ms {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.3px;
}
.mcell .md {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.mcell.explorer { border-left-color: var(--q-explorer); }
.mcell.explorer .mn { color: var(--q-explorer); }
.mcell.leader { border-left-color: var(--q-leader); }
.mcell.leader .mn { color: var(--q-leader); }
.mcell.onlooker { border-left-color: var(--q-onlooker); }
.mcell.onlooker .mn { color: var(--q-onlooker); }
.mcell.commando { border-left-color: var(--q-commando); }
.mcell.commando .mn { color: var(--q-commando); }

.axis-x {
  grid-column: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 4px 0;
  font-family: var(--font);
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* Axis heads (section dividers) */
.axis-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 28px 0 18px;
  padding: 14px 16px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-sm);
}
.axis-head .axis-dot {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--grd);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
}
.axis-head .at {
  font-family: var(--font);
  font-size: 16px;
  color: var(--text);
  letter-spacing: 0.2px;
}
.axis-head .as {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 1px;
}

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 0 0 28px;
}

/* Questions */
.q { margin-bottom: 26px; }
.q-label {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 14px;
}
.q-idx {
  flex-shrink: 0;
  font-family: var(--font);
  font-size: 14px;
  color: var(--accent);
  padding-top: 2px;
  min-width: 22px;
}
.q-tag {
  font-family: var(--font);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 2px;
}
.q-text {
  font-size: 16px;
  color: var(--text);
  line-height: 1.55;
}

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 15px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.18s ease;
}
.opt:hover {
  border-color: var(--accent-border);
  background: var(--surface-hover);
}
.opt.sel {
  border-color: var(--accent);
  background: var(--accent-bg);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.opt-key {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  transition: all 0.18s ease;
}
.opt.sel .opt-key {
  background: var(--grd);
  border-color: transparent;
  color: var(--bg);
}
.opt-text {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.6;
  padding-top: 2px;
}
.opt.sel .opt-text { color: var(--text); }

/* Footer bar (progress + submit) */
.foot-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.pbar {
  flex: 1;
  height: 6px;
  background: var(--surface-raised);
  border-radius: 3px;
  overflow: hidden;
}
.pfill {
  height: 100%;
  width: 0%;
  background: var(--grd);
  border-radius: 3px;
  transition: width 0.3s ease;
}
.plabel {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}
.btn-submit {
  padding: 11px 22px;
  background: var(--grd);
  color: var(--bg);
  border: none;
  border-radius: 10px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.2px;
  white-space: nowrap;
}
.btn-submit:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(0,113,227,0.18);
}
.btn-submit:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.footer-note {
  text-align: center;
  margin-top: 40px;
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.3px;
}

/* Results */
.results-page { display: none; }
.results-page.active { display: block; animation: fadeUp 0.5s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.res-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 28px 28px;
  margin-bottom: 24px;
}
.res-top {
  text-align: center;
  margin-bottom: 28px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--border);
}
.res-emoji { font-size: 52px; line-height: 1; margin-bottom: 14px; }
.res-name {
  font-family: var(--font);
  font-size: 32px;
  font-weight: 500;
  background: var(--grd);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
  letter-spacing: -0.3px;
}
.res-tagline {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}
.scores {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
.score-chip {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  min-width: 150px;
  text-align: center;
}
.score-chip .sl {
  font-family: var(--font);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.score-chip .sv {
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
}
.score-chip .sv small {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 400;
}
.stag {
  display: inline-block;
  font-family: var(--font);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 20px;
  margin-top: 6px;
}
.stag.high { background: rgba(74,222,128,0.12); color: var(--q-leader); border: 1px solid rgba(74,222,128,0.25); }
.stag.low { background: rgba(156,163,175,0.1); color: var(--q-onlooker); border: 1px solid rgba(156,163,175,0.22); }

/* Matrix */
.matrix-wrap { margin: 8px 0 28px; }
.matrix-cap {
  text-align: center;
  font-family: var(--font);
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 14px;
}
.matrix-layout {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 8px;
  align-items: stretch;
}
.matrix {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 8px;
  aspect-ratio: 1 / 1;
  padding: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.cell {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  opacity: 0.32;
  transition: all 0.3s ease;
}
.cell.lit {
  opacity: 1;
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}
.cell .ce { font-size: 18px; margin-bottom: 2px; }
.cell .cn {
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
}
.cell .cs { font-size: 9px; color: var(--text-muted); margin-top: 1px; }
.cell.q-leader.lit { border-color: var(--q-leader); }
.cell.q-leader.lit .cn { color: var(--q-leader); }
.cell.q-explorer.lit { border-color: var(--q-explorer); }
.cell.q-explorer.lit .cn { color: var(--q-explorer); }
.cell.q-commando.lit { border-color: var(--q-commando); }
.cell.q-commando.lit .cn { color: var(--q-commando); }
.cell.q-onlooker.lit { border-color: var(--q-onlooker); }
.cell.q-onlooker.lit .cn { color: var(--q-onlooker); }

.marker {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--grd);
  border: 2px solid #fff;
  box-shadow: 0 0 0 4px rgba(0,113,227,0.25), 0 2px 8px rgba(0,0,0,0.12);
  transform: translate(-50%, -50%);
  transition: left 0.6s cubic-bezier(0.34,1.56,0.64,1), top 0.6s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 5;
}
.marker::after {
  content: attr(data-label);
  position: absolute;
  bottom: 125%;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  white-space: nowrap;
  color: var(--bg);
  background: var(--accent-light);
  padding: 2px 8px;
  border-radius: 10px;
}

/* Result body */
.res-body { font-size: 14px; }
.r-desc {
  color: var(--text-secondary);
  line-height: 1.8;
  margin-bottom: 28px;
  font-size: 14.5px;
}
.block { margin-bottom: 26px; }
.block-h {
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 7px;
}
.block-h .title-icon { width: 16px; height: 16px; flex-shrink: 0; }
.block-h.feats .title-icon { color: var(--accent-light); }
.block-h.risks .title-icon { color: var(--red); }
.block-h.actions .title-icon { color: var(--green); }
.sn-title { display: flex; align-items: center; gap: 6px; }
.sn-title .title-icon { width: 14px; height: 14px; flex-shrink: 0; }
.li {
  display: flex;
  gap: 10px;
  padding: 7px 0;
  color: var(--text-secondary);
  line-height: 1.65;
  font-size: 13.5px;
}
.li .dot { flex-shrink: 0; color: var(--accent); font-size: 11px; padding-top: 5px; }
.li .dot.risk { color: #F87171; }

.act {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 14px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  font-size: 13.5px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.act.prio {
  background: var(--accent-bg);
  border-color: var(--accent-border);
}
.act .pf {
  flex-shrink: 0;
  font-family: var(--font);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--grd);
  padding: 2px 7px;
  border-radius: 4px;
  margin-top: 2px;
}
.act .an {
  font-family: var(--font);
  font-weight: 500;
  color: var(--text);
  margin-right: 4px;
}
.act.prio .an { color: var(--accent-light); }

/* Score note (appendix) */
.score-note {
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  margin-top: 8px;
}
.sn-title {
  font-family: var(--font);
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}
.sn-lead { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
.sn-grid { display: flex; flex-direction: column; gap: 10px; }
.sn-axis {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12.5px;
}
.sn-axis .ah { display: flex; align-items: center; gap: 6px; color: var(--text); font-weight: 500; }
.sn-axis .ah .ax {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px; height: 18px;
  border-radius: 4px;
  background: var(--grd);
  color: var(--bg);
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
}
.sn-axis .ad { color: var(--text-muted); }

/* Result foot (CTA) */
.res-foot {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  text-align: center;
}
.r-cta {
  font-family: var(--font);
  font-size: 16px;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 8px;
}
.cta-text {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 18px;
}
.btn-learn {
  display: inline-block;
  padding: 12px 26px;
  background: var(--grd);
  color: var(--bg);
  border-radius: 10px;
  text-decoration: none;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
  transition: all 0.2s ease;
  margin-bottom: 10px;
}
.btn-learn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(0,113,227,0.18);
}
.btn-restart {
  display: block;
  margin: 0 auto;
  padding: 9px 22px;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-restart:hover { border-color: var(--accent-border); color: var(--text); }
.btn-share {
  display: inline-block;
  margin-left: 10px;
  padding: 12px 26px;
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 10px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-bottom: 10px;
  vertical-align: top;
}
.btn-share:hover {
  background: var(--accent);
  color: var(--bg);
}

/* Next-lens strip */
.next-lens {
  margin-top: 24px;
  padding: 22px 24px;
  background: var(--surface-2);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
}
.next-lens h3 {
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.3px;
  margin-bottom: 12px;
  color: var(--text);
}
.lens-links {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.lens-links a {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 13px 15px;
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  text-decoration: none;
  transition: all 0.2s ease;
}
.lens-links a:hover {
  border-color: var(--accent-border);
  transform: translateY(-2px);
}
.lens-links a strong {
  font-family: var(--font);
  font-size: 13.5px;
  font-weight: 600;

}
.lens-links a span {
  font-size: 12px;
  line-height: 1.45;

}

/* Result actions: PDF export + hub return */
.btn-pdf {
  display: inline-block;
  margin-left: 0;
  padding: 12px 26px;
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 10px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-bottom: 10px;
  vertical-align: top;
}
.btn-pdf:hover {
  background: var(--accent);
  color: var(--bg);
}
.btn-hub {
  display: inline-block;
  margin-left: 10px;
  padding: 9px 22px;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-hub:hover { border-color: var(--accent-border); color: var(--text); }
/* One size for every result action */
.btn-learn,
.btn-share,
.btn-pdf,
.btn-restart,
.btn-hub {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 46px;
  padding: 0 26px;
  font-size: 14px;
  font-weight: 600;
  box-sizing: border-box;
  vertical-align: top;
}
.cta-row + .cta-row { margin-top: 2px; }
.btn-restart { display: inline-flex; margin-left: 10px; }

/* Print — export the result report as PDF */
.print-head { display: none; }
@media print {
  @page { margin: 14mm; }
  body { background: #fff; }
  .bar, .header, #form-wrap, .footer-note, .next-lens, .res-foot, .ribbon-overlay { display: none !important; }
  .container { max-width: none; margin: 0; padding: 0; }
  .results-page { display: block !important; animation: none; }
  .res-card { border: none; box-shadow: none; padding: 0; }
  .print-head { display: block; font-family: var(--font); font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
  .res-top, .scores, .matrix-layout, .block, .score-note { break-inside: avoid; }
}

/* Responsive */
@media (max-width: 600px) {
  .container { padding: 40px 16px 56px; }
  .header h1 { font-size: 26px; }
  .card { padding: 26px 20px; }
  .res-card { padding: 28px 20px 22px; }
  .res-name { font-size: 26px; }
  .res-emoji { font-size: 42px; }
  .foot-bar { flex-wrap: wrap; }
  .plabel { order: -1; width: 100%; margin-bottom: 4px; }
  .axis-x, .axis-y { font-size: 8px; }
  .cell .cn { font-size: 11px; }
  .cell .ce { font-size: 14px; }
  .sn-axis { font-size: 11.5px; }
  .lens-links { grid-template-columns: 1fr; }
  .btn-share { margin-left: 0; margin-top: 8px; }
  .btn-pdf { margin-left: 0; margin-top: 8px; }
  .btn-restart { margin-left: 0; margin-top: 8px; }
  .btn-hub { margin: 8px 0 0 0; }
}
/* Ribbon celebration */
.ribbon-overlay{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
.ribbon{position:absolute;top:0;will-change:transform;animation:ribbon-fall var(--fall) cubic-bezier(.3,.45,.55,1) var(--delay) both;}
.ribbon i{display:block;width:100%;height:100%;border-radius:2px;animation:ribbon-tumble var(--tumble) linear infinite;}
@keyframes ribbon-fall{
  0%{transform:translate3d(0,-72px,0) rotate(0deg);opacity:0;}
  6%{opacity:1;}
  85%{opacity:1;}
  100%{transform:translate3d(var(--sway),112vh,0) rotate(var(--spin));opacity:0;}
}
@keyframes ribbon-tumble{
  from{transform:rotate3d(1,.8,.3,0deg);}
  to{transform:rotate3d(1,.8,.3,360deg);}
}

function t(key) { return i18n[currentLang][key]; }

function axisHead(dot, title, sub) {
  const d = document.createElement('div');
  d.className = 'axis-head';
  d.innerHTML = '<div class="axis-dot">' + dot + '</div><div><div class="at">' + title + '</div><div class="as">' + sub + '</div></div>';
  return d;
}

function buildQuestions() {
  const qc = document.getElementById('questions');
  qc.innerHTML = '';
  qc.appendChild(axisHead('X', t('axisXHead'), t('axisXHeadSub')));
  i18n[currentLang].questions.forEach(function(q, i) {
    if (i === 5) {
      const hr = document.createElement('hr');
      hr.className = 'divider';
      qc.appendChild(hr);
      qc.appendChild(axisHead('Y', t('axisYHead'), t('axisYHeadSub')));
    }
    const num = String(i + 1).padStart(2, '0');
    const wrap = document.createElement('div');
    wrap.className = 'q';
    wrap.innerHTML = '<div class="q-label"><div class="q-idx">' + num + '</div><div><div class="q-tag">' + q.tag + '</div><div class="q-text">' + q.q + '</div></div></div><div class="opts" id="opts-' + i + '"></div>';
    qc.appendChild(wrap);
    const ow = wrap.querySelector('#opts-' + i);
    q.opts.forEach(function(txt, j) {
      const key = 'ABCD'[j];
      const sel = answers[i] === (j + 1) ? ' sel' : '';
      const el = document.createElement('div');
      el.className = 'opt' + sel;
      el.innerHTML = '<div class="opt-key">' + key + '</div><div class="opt-text">' + txt + '</div>';
      el.addEventListener('click', function() {
        ow.querySelectorAll('.opt').forEach(function(o) { o.classList.remove('sel'); });
        el.classList.add('sel');
        answers[i] = j + 1;
        updateProgress();
        var prevDone = answers.slice(0, i + 1).every(function(a) { return a !== null; });
        var nextOpen = (i === 10) || answers[i + 1] === null;
        if (prevDone && nextOpen) {
          setTimeout(function() {
            var target;
            if (i < 10) {
              target = wrap.nextElementSibling;
              while (target && !target.classList.contains('q')) { target = target.nextElementSibling; }
            } else {
              target = document.getElementById('submit');
            }
            if (target) target.scrollIntoView({ behavior: prefersReduced() ? 'auto' : 'smooth', block: 'center' });
          }, 300);
        }
      });
      ow.appendChild(el);
    });
  });
}

  document.getElementById('r-xtag').innerHTML = '<span class="stag ' + (xHigh ? 'high' : 'low') + '">' + t('scoreXShort') + ' ' + (xHigh ? t('scoreHigh') : t('scoreLow')) + '</span>';
  document.getElementById('r-ytag').innerHTML = '<span class="stag ' + (yHigh ? 'high' : 'low') + '">' + t('scoreYShort') + ' ' + (yHigh ? t('scoreHigh') : t('scoreLow')) + '</span>';
  document.getElementById('r-desc').textContent = Q.desc;

  renderMatrix();
  document.querySelectorAll('.cell').forEach(function(c) {
    c.classList.toggle('lit', c.dataset.key === key);
  });
  const half = function(v, lo, mid, hi) {
    return v <= mid ? (v - lo) / (mid - lo) * 0.5 : 0.5 + (v - (mid + 1)) / (hi - (mid + 1)) * 0.5;
  };
  let xp = half(x, 5, 13, 20), yp = half(y, 6, 14, 24);
  xp = Math.min(0.92, Math.max(0.08, xp));
  yp = Math.min(0.92, Math.max(0.08, yp));
  const mk = document.getElementById('marker');
  mk.style.left = (xp * 100) + '%';
  mk.style.top = ((1 - yp) * 100) + '%';
  mk.setAttribute('data-label', t('markerLabel'));

  document.getElementById('r-feats').innerHTML = Q.feats.map(function(f) {
    return '<div class="li"><span class="dot">▸</span><span>' + f + '</span></div>';
  }).join('');
  document.getElementById('r-risks').innerHTML = Q.risks.map(function(r) {
    return '<div class="li"><span class="dot risk">▸</span><span>' + r + '</span></div>';
  }).join('');
  document.getElementById('r-actions').innerHTML = Q.actions.map(function(a, i) {
    const prio = i === Q.prio;
    return '<div class="act ' + (prio ? 'prio' : '') + '">' + (prio ? '<span class="pf">' + t('prioTag') + '</span>' : '') + '<span class="an">' + a[0] + ':</span><span>' + a[1] + '</span></div>';
  }).join('');
  document.getElementById('r-cta').textContent = Q.cta;

  document.getElementById('form-wrap').style.display = 'none';
  document.getElementById('results-page').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prefersReduced() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function buildLensLinks() {
  var el = document.getElementById('lens-links');
  el.innerHTML = lensLinks.map(function(l) {
    return '<a href="' + l.href + '"><strong>' + t(l.nameKey) + '</strong><span>' + t(l.descKey) + '</span></a>';
  }).join('');
  document.getElementById('next-lens-title').textContent = t('nextLensTitle');
}

function shareResult() {
  var Q = quadData[currentLang][computedKey];
  var text = currentLang === 'en'
    ? 'My organization just landed in the ' + Q.name + ' quadrant of the AI-nativeness matrix. 11 questions, 3 minutes, scored in your browser — diagnose yours:'
    : '我的组织刚在 AI 原生度矩阵中落在了「' + Q.name + '」象限。11 道题、3 分钟、浏览器内评分——来诊断你的组织：';
  text += ' ' + new URL(HUB_URL, location.href).href;
  copyToClipboard(text);
  var btn = document.getElementById('btn-share');
  btn.textContent = t('copied');
  setTimeout(function() { btn.textContent = t('shareBtn'); }, 1800);
}

function copyToClipboard(text) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
}

function restart() {
  for (let i = 0; i < 11; i++) answers[i] = null;
  document.querySelectorAll('.opt').forEach(function(o) { o.classList.remove('sel'); });
  document.getElementById('results-page').classList.remove('active');
  document.getElementById('form-wrap').style.display = '';
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

applyLang();
updateProgress();
function launchRibbons() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var old = document.querySelector('.ribbon-overlay');
  if (old) old.remove();
  var colors = ['#0071e3', '#2997ff', '#34c759', '#ffcc00', '#ff9f0a', '#ff375f', '#af52de'];
  var overlay = document.createElement('div');
  overlay.className = 'ribbon-overlay';
  for (var i = 0; i < 34; i++) {
    var r = document.createElement('div');
    r.className = 'ribbon';
    r.style.left = (Math.random() * 100) + '%';
    var isStream = Math.random() < 0.22;
    r.style.width = (isStream ? 5 + Math.random() * 2 : 6 + Math.random() * 4) + 'px';
    r.style.height = (isStream ? 52 + Math.random() * 34 : 16 + Math.random() * 22) + 'px';
    r.style.setProperty('--fall', (2.3 + Math.random() * 1.3) + 's');
    r.style.setProperty('--delay', (Math.random() * 0.9) + 's');
    r.style.setProperty('--sway', (Math.random() * 180 - 90) + 'px');
    r.style.setProperty('--spin', (Math.random() < 0.5 ? '-' : '') + (300 + Math.floor(Math.random() * 500)) + 'deg');
    r.style.setProperty('--tumble', (0.6 + Math.random() * 0.7) + 's');
    var s = document.createElement('i');
    s.style.background = colors[i % colors.length];
    r.appendChild(s);
    overlay.appendChild(r);
  }
  document.body.appendChild(overlay);
  setTimeout(function() { overlay.remove(); }, 4800);
}
</script>
